name: Release Exam Grader

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (64-bit)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Build Windows binary with PyInstaller
        run: |
          python scripts/build/build.py

      - name: Verify Windows binary (self-check)
        run: |
          .\dist\ExamGrader\ExamGrader.exe --self-check

      - name: Compile Inno Setup installer
        run: |
          iscc scripts/build/windows-installer.iss

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = (Get-ChildItem dist\Exam-Grader-*-Windows-Setup.exe | Select-Object -First 1).FullName
          if (-not $file) {
            Write-Error "No Windows setup executable found in dist\"
            exit 1
          }
          $filename = Split-Path -Leaf $file
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $filename" | Out-File -FilePath "$file.sha256" -Encoding utf8
          Write-Host "SHA256 ($filename): $hash"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Exam-Grader-Windows-Setup
          path: |
            dist/Exam-Grader-*-Windows-Setup.exe
            dist/Exam-Grader-*-Windows-Setup.exe.sha256

      - name: Upload Windows Installer to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag -or $tag -eq "") {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -eq "main" -or $tag -eq "master" -or -not $tag) {
            $match = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.*)"'
            if ($match) {
              $ver = $match.Matches.Groups[1].Value
              $tag = "v$ver"
            } else {
              $tag = "v1.0.1"
            }
          }
          Write-Host "Target Release Tag: $tag"
          $files = Get-ChildItem dist/Exam-Grader-*-Windows-Setup.exe* | ForEach-Object { $_.FullName }
          $releaseExists = $false
          try {
            gh release view $tag --json id 2>$null
            if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          } catch {
            $releaseExists = $false
          }
          if ($releaseExists) {
            gh release upload $tag @files --clobber
          } else {
            Write-Host "Release $tag does not exist yet. Artifacts are preserved in workflow run and will be attached to the release."
          }
