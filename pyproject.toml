[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-grader"
version = "1.1.0"
description = "Desktop exam grading application foundation for teachers"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.8,<7", "platformdirs>=4,<5", "openpyxl>=3.1,<4", "opencv-python-headless>=4.10,<5", "numpy>=2,<3", "qrcode>=8,<9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "pyinstaller>=6,<7"]

[project.scripts]
exam-grader = "exam_grader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exam_grader = ["resources/*.json", "resources/*.png", "resources/*.svg", "resources/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
